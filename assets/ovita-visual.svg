<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">OVITA visual abstract</title><desc id="d">A natural language instruction is converted to code that adapts a three-dimensional robot trajectory.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4ece8"/><stop offset="1" stop-color="#f8faf8"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#147e73"/><stop offset="1" stop-color="#41c7b5"/></linearGradient></defs>
<rect width="720" height="520" rx="26" fill="url(#bg)"/><g stroke="#cbd8d2" opacity=".75"><path d="M0 90H720M0 180H720M0 270H720M0 360H720M0 450H720"/><path d="M90 0V520M180 0V520M270 0V520M360 0V520M450 0V520M540 0V520M630 0V520"/></g>
<rect x="58" y="62" width="232" height="92" rx="18" fill="#fff" stroke="#c4d2cc"/><circle cx="88" cy="91" r="8" fill="#41c7b5"/><text x="108" y="96" font-size="13" font-family="Arial" font-weight="700" fill="#0a1720">Natural-language feedback</text><text x="80" y="125" font-size="13" font-family="Arial" fill="#60716a">“Go higher and slow near</text><text x="80" y="143" font-size="13" font-family="Arial" fill="#60716a">the obstacle.”</text>
<path d="M302 108H395" stroke="#758a80" stroke-width="2"/><path d="M385 100l12 8-12 8" fill="none" stroke="#758a80" stroke-width="2"/>
<rect x="409" y="53" width="250" height="120" rx="18" fill="#07131c"/><text x="431" y="83" font-size="13" font-family="Arial" font-weight="700" fill="#9ee9df">CODE AS ADAPTATION POLICY</text><text x="431" y="110" font-size="12" font-family="monospace" fill="#d8e8eb">for waypoint in trajectory:</text><text x="431" y="132" font-size="12" font-family="monospace" fill="#d8e8eb">  z += Δz; velocity *= α</text><text x="431" y="154" font-size="11" font-family="Arial" fill="#879da5">interpretable · editable · auditable</text>
<g transform="translate(82 225)"><path d="M0 164C80 148 98 62 178 79s115 122 197 83 89-138 166-122" fill="none" stroke="#9eaaa4" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 12"/><path d="M0 164C72 150 110 98 172 96s101 71 179 36 111-104 190-91" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="164" r="12" fill="#0a1720"/><circle cx="541" cy="41" r="12" fill="#0a1720"/><g fill="#fff" stroke="#147e73" stroke-width="3"><circle cx="99" cy="115" r="9"/><circle cx="172" cy="96" r="9"/><circle cx="268" cy="136" r="9"/><circle cx="351" cy="132" r="9"/><circle cx="450" cy="70" r="9"/></g><rect x="254" y="37" width="70" height="54" rx="9" fill="#efb28f" opacity=".9"/><text x="289" y="69" text-anchor="middle" font-size="11" font-family="Arial" font-weight="700" fill="#5c321d">obstacle</text><text x="0" y="205" font-size="12" font-family="Arial" fill="#6a7b73">original trajectory</text><text x="385" y="205" font-size="12" font-family="Arial" font-weight="700" fill="#147e73">adapted trajectory</text></g>
<text x="360" y="477" text-anchor="middle" fill="#20343c" font-family="Arial" font-size="17" font-weight="700">OVITA · language → interpretable trajectory adaptation</text></svg>
